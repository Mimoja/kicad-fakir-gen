# Which side of the board the pogo pins land on
test_point_side: "B.Cu"
# Which footprints count as test points
ref_pattern: "^TP\\d+$"

pcb:
  thickness: 1.6
  note_top: "Only the pogo pins on this side"
  note_bottom: "Business logic goes on this side"

holder:
  thickness: 10.0
  # printers close holes up a little; this is added to the bore
  print_hole_allowance: 0.10
  # Add threaded inserts or screw directly into the plastic
  threaded_inserts: true
