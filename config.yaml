# Which pogo pin.  The numbers behind the names, all in mm:
# NAME  BARREL   TIP  LENGTH  STROKE
# P50     0.68  0.90    16.4    2.65
# P75     1.02  1.30    16.6    2.65
# P100    1.36  1.80    33.4    6.35
# P125    2.02  2.50    33.4    6.35
# P160    2.36  3.00    44.5    4.00
pogo_pin: "P75"

# Which side of the board the pogo pins land on
test_point_side: "B.Cu"
# Which footprints count as test points
ref_pattern: "^TP\\d+$"

pcb:
  thickness: 1.6
  # How far the fakir board stands out past the target board, on each side
  margin: 7.0
  # Clearance around the barrel for soldering it in; the fab's tolerance
  # is inside this, do not add it again
  drill_hole_extra: 0.15
  note_top: "Only the pogo pins on this side"
  note_bottom: "Business logic goes on this side"

holder:
  # The probe would be a friction fit in an ideal world; printers close
  # holes up a little, so this much is added to the bore
  print_hole_allowance: 0.10
  # Add threaded inserts or screw directly into the plastic
  threaded_inserts: true
  # The plate under the board; thicker if it flexes
  base_thickness: 3.0
  # Room around the board's outline, and plate past it
  board_clearance: 0.40
  body_border: 2.5
  feet: true
  foot_height: 8.0
