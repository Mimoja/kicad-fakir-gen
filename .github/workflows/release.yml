name: release

# A tag v<version> builds the package and publishes it to PyPI.  The
# version comes from fakir/__init__.py and has to match the tag.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: tag and package version agree
        run: |
          version=$(python -c "import fakir; print(fakir.__version__)")
          [ "v$version" = "${GITHUB_REF_NAME}" ] \
            || { echo "tag ${GITHUB_REF_NAME} but package is $version"; exit 1; }
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
