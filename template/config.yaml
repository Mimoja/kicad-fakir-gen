# fakir fixture configuration for @@SOURCE_NAME@@.

# Which pogo pin to use for generating
#
# NAME   BARREL LENGTH STROKE
# P50    0.68   16.35  2.65
# P75    1.02   16.55  2.65
# P100   1.36   33.35  6.35
# P125   1.67   33.35  6.35
# P160   2.03   44.50  4.00
pogo_pin: "P75"

# Which screw to mount the fakir board to the holder. Defines the heatset insert
# SCREW  PCB_HOLE SCREW_PASSAGE INSERT_BORE INSERT_DEPTH INSERT_FLOOR HEAD_BORE   TAP  BOSS
# M2          2.2           2.4         3.2          4.0          2.0       3.8   1.6   5.0
# M3          3.2           3.4         4.0          6.0          3.0       5.6   2.5   7.0
# M4          4.3           4.5         5.6          8.0          4.0       7.0   3.3   9.0
# M5          5.3           5.5         6.4          9.5          5.0       8.5   4.2  11.0
screw: "M3"

# Which side's test points to probe, and what counts as a test point.
test_point_side: "B.Cu"
ref_pattern: "^TP\\d+$"

# Config for the PCB generation
pcb:
  thickness: 1.6

  # How far the fakir board stands out past the target board.
  # It carries the mounting screws, so it cannot go much below
  # the screw's own head.
  margin: 6.0

  # Clearance around the probe barrel to insert it into the PCB
  drill_hole_extra: 0.15

  # How much barrel is left under the board to solder to
  solder_length: 1.5

  note_top: "Only the pogo pins on this side"
  note_bottom: "Business logic goes on this side"

# 3d printed holder
holder:
  # Swing the lid, the hinge posts and the key away from whatever
  # stands tall on the board: 0, 90, 180 or 270 degrees
  rotation: 0
  tower_height: 15.0

  # The pogo pins would be friction fit in an ideal world,
  # however this is needed for 3d printing
  # If supported use hole compensation in your slicer to avoice messing with this
  print_hole_allowance: 0.4
  # As above: Margin between board and the holder it gets pressed into
  print_board_allowance: 0.60

  # Add threaded inserts or screw directly into the plastic
  threaded_inserts: true

  # Should there be a lid?
  clamp: true

  # We domt want to touch the target board with m3 screws, so we render caps
  presser_cap_height: 20.0

  # Increase if the holder flexes
  base_thickness: 3.0

  # The wall around the target PCB
  body_border: 2.5

  # Spacing under the fakir board
  feet: true
  foot_height: 8.0

# output options
render:
  # What generate.sh --3d writes
  # Options:
  # - step
  # - stl
  # - 3mf
  # - amf
  holder_format: step,stl

  # Where the 3D models KiCad shows the fixture with are written
  model_dir: "3dshapes"

  # Where the files for the slicer go
  print_dir: "PrintFiles"

  stackup: true
  stackup_size: [1000, 1000]  # in pixels rendered
