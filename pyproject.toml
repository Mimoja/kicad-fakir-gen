[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-fakir-gen"
dynamic = ["version"]
description = "Pogo-pin test fixture generator for KiCad: PCB, schematic and 3D-printed holder from a board's test points"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
keywords = ["kicad", "pcb", "test-fixture", "pogo-pin", "bed-of-nails"]
classifiers = [
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "cadquery>=2.5",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/Mimoja/kicad-fakir-gen"
Issues = "https://github.com/Mimoja/kicad-fakir-gen/issues"

[project.optional-dependencies]
dev = ["pyflakes", "pycodestyle", "build"]

[tool.setuptools]
packages = ["fakir"]

[tool.setuptools.dynamic]
version = { attr = "fakir.__version__" }
